<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 435 50'
    style='background-color: #FFFFFF00;'
    width='435px' height='50px'>

    <style>
@font-face {
  font-family: 'Bitcount Single';
  font-style: normal;
  font-weight: 200;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
</style>

                <path id='path0'>
                            <!-- Single line -->
                                <animate id='d0' attributeName='d' begin='0s'
                    dur='1ms' fill='freeze'
                    values='m0,25 h0 ; m0,25 h435 ; m0,25 h435 ; m0,25 h435' keyTimes='0;0.8;0.8;1' />
                    </path>
    <text font-family='"Bitcount Single", monospace' fill='#C678DD' font-size='35'
        dominant-baseline='auto'
        x='0%' text-anchor='start'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            Immersion
        </textPath>
    </text>
</svg>
