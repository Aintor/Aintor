<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 435 80'
    style='background-color: #FFFFFF00;'
    width='435px' height='80px'>

    <style>
@font-face {
  font-family: 'Bitcount Single';
  font-style: normal;
  font-weight: 300;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
</style>

                <path id='path0'>
                            <!-- Single line -->
                                <animate id='d0' attributeName='d' begin='0s;d2.end'
                    dur='4000ms' fill='remove'
                    values='m0,40 h0 ; m0,40 h435 ; m0,40 h435 ; m0,40 h0' keyTimes='0;0.8;0.8;1' />
                    </path>
    <text font-family='"Bitcount Single", monospace' fill='#E5C07B' font-size='50'
        dominant-baseline='auto'
        x='0%' text-anchor='start'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            Aintor
        </textPath>
    </text>
        <path id='path1'>
                            <!-- Single line -->
                                <animate id='d1' attributeName='d' begin='d0.end'
                    dur='4000ms' fill='remove'
                    values='m0,40 h0 ; m0,40 h435 ; m0,40 h435 ; m0,40 h0' keyTimes='0;0.8;0.8;1' />
                    </path>
    <text font-family='"Bitcount Single", monospace' fill='#E5C07B' font-size='50'
        dominant-baseline='auto'
        x='0%' text-anchor='start'
        letter-spacing='normal'>
        <textPath xlink:href='#path1'>
            Jason Wong
        </textPath>
    </text>
        <path id='path2'>
                            <!-- Single line -->
                                <animate id='d2' attributeName='d' begin='d1.end'
                    dur='4000ms' fill='remove'
                    values='m0,40 h0 ; m0,40 h435 ; m0,40 h435 ; m0,40 h0' keyTimes='0;0.8;0.8;1' />
                    </path>
    <text font-family='"Bitcount Single", monospace' fill='#E5C07B' font-size='50'
        dominant-baseline='auto'
        x='0%' text-anchor='start'
        letter-spacing='normal'>
        <textPath xlink:href='#path2'>
            It&#039;s me.
        </textPath>
    </text>
</svg>
